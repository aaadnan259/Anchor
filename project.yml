name: Anchor
options:
  bundleIdPrefix: com.adnan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  Adhan:
    url: https://github.com/batoulapps/adhan-swift
    from: 1.4.0

targets:
  Anchor:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Anchor
        excludes:
          - "Preview Content/**"
    resources:
      - path: Anchor/Preview Content
    dependencies:
      - package: Adhan
        product: Adhan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adnan.Anchor
        DEVELOPMENT_ASSET_PATHS: "\"Anchor/Preview Content\""
        ENABLE_PREVIEWS: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Anchor/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: "Anchor uses your location to calculate accurate prayer times for your Prayer habit. Location is never stored or shared."

  AnchorTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AnchorTests
    dependencies:
      - target: Anchor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adnan.AnchorTests
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Anchor uses your location to calculate accurate prayer times for your Prayer habit. Location is never stored or shared."

schemes:
  Anchor:
    build:
      targets:
        Anchor: all
        AnchorTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AnchorTests
    archive:
      config: Release
